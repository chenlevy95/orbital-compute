# Mock Orbital Compute Billing API on Kubernetes. Provided as-is: apply it, don't change it.
#
#   kubectl apply -f mock_api/k8s/billing-api.yaml
#
# In the cluster the API is at http://billing-api.orbital.svc.cluster.local:8765
# (or http://billing-api:8765 from the same namespace).
#
# The API's "today" comes from AS_OF. This is how we move it during grading:
#   kubectl -n orbital set env deployment/billing-api AS_OF=2026-09-28
#   kubectl -n orbital rollout status deployment/billing-api
apiVersion: v1
kind: Namespace
metadata:
  name: orbital
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-api
  namespace: orbital
  labels:
    app.kubernetes.io/name: billing-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: billing-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing-api
    spec:
      containers:
        - name: billing-api
          image: orbital-billing-api:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: AS_OF
              value: "2026-09-20"
          ports:
            - name: http
              containerPort: 8765
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: billing-api
  namespace: orbital
spec:
  selector:
    app.kubernetes.io/name: billing-api
  ports:
    - name: http
      port: 8765
      targetPort: http
